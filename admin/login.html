<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ميلانو OTC</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,var(--dark) 0%,var(--dark-2) 50%,var(--dark-3) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-card{background:#fff;border-radius:20px;padding:44px 36px 36px;width:100%;max-width:400px;box-shadow:0 25px 80px rgba(0,0,0,0.25);position:relative;overflow:hidden}
        .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold))}
        .login-top{text-align:center;margin-bottom:32px}
        .login-top img{height:52px;margin:0 auto 14px}
        .login-top h1{font-size:1.3rem;font-weight:800;color:var(--dark)}
        .login-top p{font-size:0.85rem;color:var(--text-sub);margin-top:2px}
        .login-field{margin-bottom:18px}
        .login-field label{display:block;margin-bottom:5px;font-weight:600;color:var(--dark);font-size:0.85rem}
        .login-field .field-wrap{position:relative}
        .login-field .field-wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:0.95rem}
        .login-field input{width:100%;padding:13px 42px 13px 14px;border:2px solid var(--border);border-radius:var(--r-sm);font-size:0.92rem;transition:all .3s var(--ease);background:#fff;color:var(--text)}
        .login-field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
        .login-field input::placeholder{color:#c0c4cc}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;border:none;border-radius:var(--r-sm);font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-top:6px}
        .login-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-gold)}
        .login-btn:active{transform:translateY(0)}
        .login-error{background:#fee2e2;color:#991b1b;padding:11px 14px;border-radius:var(--r-sm);margin-bottom:18px;display:none;align-items:center;gap:8px;font-size:0.88rem;border:1px solid #fecaca;font-weight:500}
        .login-error.show{display:flex}
        .login-demo{margin-top:22px;padding:14px 18px;background:var(--bg);border-radius:var(--r-sm);font-size:0.82rem;color:var(--text-sub);text-align:center;border:1px dashed var(--border)}
        .login-demo strong{color:var(--dark)}
        .login-back{display:block;text-align:center;margin-top:18px;color:#9ca3af;font-size:0.82rem;transition:color .2s}
        .login-back:hover{color:var(--gold)}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-top">
            <img src="../assets/logo.png" alt="ميلانو OTC">
            <h1>لوحة التحكم</h1>
            <p>مركز تتبع الطلبات ميلانو OTC</p>
        </div>
        <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i><span>اسم المستخدم أو كلمة المرور غير صحيحة</span></div>
        <form id="loginForm">
            <div class="login-field">
                <label>اسم المستخدم</label>
                <div class="field-wrap"><i class="fas fa-user"></i><input type="text" id="username" required placeholder="admin"></div>
            </div>
            <div class="login-field">
                <label>كلمة المرور</label>
                <div class="field-wrap"><i class="fas fa-lock"></i><input type="password" id="password" required placeholder="••••••"></div>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i>تسجيل الدخول</button>
        </form>
        <div class="login-demo"><strong>تجريبي:</strong> admin / 123456</div>
        <a href="../index.html" class="login-back"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>
    <script>
        if(sessionStorage.getItem('adminLoggedIn')==='true')window.location.href='index.html';
        document.getElementById('loginForm').addEventListener('submit',function(e){
            e.preventDefault();
            if(document.getElementById('username').value==='admin'&&document.getElementById('password').value==='123456'){
                sessionStorage.setItem('adminLoggedIn','true');
                window.location.href='index.html';
            }else{document.getElementById('loginError').classList.add('show');}
        });
    </script>
</body>
</html>
